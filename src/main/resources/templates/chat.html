<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>pastel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.classless.min.css">
    <!-- htmxの読み込み -->
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2/dist/htmx.min.js"></script>
</head>

<body>
    <main>
        <h1>Pastel developing now</h1>
        <!-- 履歴 -->
        <div id="messages">
            <!-- messageList。Controllerから呼ばれる -->
            <th:block th:fragment="messageList">
                <div th:each="m : ${messages}">
                    <strong th:text="${m.role}">role</strong>
                    <p th:text="${m.content}">本文</p>
                </div>
            </th:block>
        </div>

        <!-- 送信フォーム -->
        <form hx-post="/send" hx-target="#messages" hx-swap="beforeend">
            <textarea name="message" required></textarea>
            <button type="submit">送信</button>
        </form>
    </main>
</body>

</html>
