spring.application.name=pastel

# DB用設定
spring.datasource.url=jdbc:sqlite:data/pastel.db
spring.datasource.hikari.maximum-pool-size=1

# AI設定
#spring.ai.anthropic.chat.model=claude-haiku-4-5
#spring.ai.anthropic.chat.model=claude-sonnet-5-5
spring.ai.anthropic.chat.model=gemma4
spring.ai.anthropic.chat.max-tokens=8192
spring.config.import=optional:file:.env[.properties]
#spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.api-key=dummy
spring.ai.anthropic.base-url=http://127.0.0.1:9931


# PASTEL.mdのバージョン
pastel.md-version=0.0.11

# tavily関連の設定
tavily.api-key=${TAVILY_API_KEY}

# pastelのVaultのpath
pastel.vault.research-dir=data/pastelMemory/research
pastel.vault.memory-dir=data/pastelMemory/memory
pastel.vault.dailyNote-dir=data/pastelMemory/dailyNote

#log設定
logging.file.name=logs/pastel.log

# 画像の設定
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB